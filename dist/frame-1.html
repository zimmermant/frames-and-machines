"use strict";
// ===== geometry.js =====
// Geometry stays in textbook coordinates (y up); rendering owns the y flip.
function resolvePoint(fig, point) {
  const p = typeof point === 'string' ? fig.points[point] : point;
  if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) {
    throw new Error(`Invalid figure point: ${String(point)}`);
  }
  return { x:p.x, y:p.y };
}

function arcAngles(fig, segment) {
  const from = resolvePoint(fig,segment.from);
  const to = resolvePoint(fig,segment.to);
  const start = Math.atan2(from.y-segment.center.y,from.x-segment.center.x);
  const end = Math.atan2(to.y-segment.center.y,to.x-segment.center.x);
  const turn = 2*Math.PI;
  const sweep = segment.ccw ? ((end-start)%turn+turn)%turn : -(((start-end)%turn+turn)%turn);
  return { start, sweep };
}

function sampleArc(fig, segment, steps = 32) {
  if (!Number.isInteger(steps) || steps<1) throw new Error('Arc sampling needs a positive integer step count');
  const { start, sweep } = arcAngles(fig,segment);
  return Array.from({length:steps+1},(_,i) => {
    if (i===0) return resolvePoint(fig,segment.from);
    if (i===steps) return resolvePoint(fig,segment.to);
    const angle=start+sweep*i/steps;
    return {x:segment.center.x+segment.r*Math.cos(angle),y:segment.center.y+segment.r*Math.sin(angle)};
  });
}

function nearestPoint(fig, member, point) {
  const p=resolvePoint(fig,point);
  let nearest=null, best=Infinity;
  for (const segment of member.path) {
    const a=resolvePoint(fig,segment.from), b=resolvePoint(fig,segment.to);
    let candidates;
    if (segment.seg==='line') {
      const dx=b.x-a.x, dy=b.y-a.y;
      const length2=dx*dx+dy*dy;
      const t=length2===0 ? 0 : Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/length2));
      candidates=[{x:a.x+t*dx,y:a.y+t*dy}];
    } else if (segment.seg==='arc') {
      const { start, sweep }=arcAngles(fig,segment);
      const angle=Math.atan2(p.y-segment.center.y,p.x-segment.center.x);
      const turn=2*Math.PI;
      const travel=(((segment.ccw ? angle-start : start-angle)%turn)+turn)%turn;
      candidates=[a,b];
      if (travel<=Math.abs(sweep)+1e-12) {
        candidates.push({x:segment.center.x+segment.r*Math.cos(angle),y:segment.center.y+segment.r*Math.sin(angle)});
      }
    } else throw new Error(`Unknown path segment: ${segment.seg}`);
    for (const q of candidates) {
      const d=(p.x-q.x)**2+(p.y-q.y)**2;
      if (d<best) { nearest=q; best=d; }
    }
  }
  if (!nearest) throw new Error(`Member ${member.id} has no path`);
  return nearest;
}

function pointOnPath(fig, member, point, tolerance = 1e-9) {
  const p=resolvePoint(fig,point), q=nearestPoint(fig,member,p);
  return Math.hypot(p.x-q.x,p.y-q.y)<tolerance;
}

// ===== linalg.js =====
// Square-system linear algebra for rigid-body statics. Copy inputs and choose
// the largest available pivot in each column before eliminating below it.
const ZERO_TOL = 1e-12;

function solveLinear(matrix, rhs) {
  const n=matrix.length;
  if (!n || rhs.length!==n || matrix.some(row => row.length!==n)) {
    throw new Error('solveLinear: expected a square matrix and matching right-hand side');
  }
  const a=matrix.map((row,i) => [...row,rhs[i]]);
  if (a.some(row => row.some(v => !Number.isFinite(v)))) throw new Error('solveLinear: non-finite input');
  for (let col=0;col<n;col++) {
    let pivot=col;
    for (let row=col+1;row<n;row++) {
      if (Math.abs(a[row][col])>Math.abs(a[pivot][col])) pivot=row;
    }
    if (Math.abs(a[pivot][col])<ZERO_TOL) throw new Error('solveLinear: singular matrix');
    [a[col],a[pivot]]=[a[pivot],a[col]];
    for (let row=col+1;row<n;row++) {
      const factor=a[row][col]/a[col][col];
      a[row][col]=0;
      for (let j=col+1;j<=n;j++) a[row][j]-=factor*a[col][j];
    }
  }
  const answer=Array(n).fill(0);
  for (let row=n-1;row>=0;row--) {
    let value=a[row][n];
    for (let col=row+1;col<n;col++) value-=a[row][col]*answer[col];
    answer[row]=value/a[row][row];
  }
  return answer;
}

// ===== solve.js =====



function clean(value) {
  return Math.abs(value)<1e-12 ? 0 : value;
}

// Positive internal forces act on members[0]; the second member receives
// exactly the opposite. A contact unknown is a signed scalar along its normal.
function solve(fig, loads) {
  const memberRows=new Map(fig.members.map((m,i) => [m.id,3*i]));
  const origins=fig.members.map(m => resolvePoint(fig,m.path[0].from));
  const unknowns=[];
  const keys=new Set();
  const supportPins=new Set(fig.supports.filter(c => c.kind==='pin').map(c => c.name));
  for (const [connections,internal] of [[fig.supports,false],[fig.joints,true]]) {
    for (const connection of connections) {
      const subs=connection.kind==='pin' ? ['x','y'] : [null];
      for (const sub of subs) {
        const suffix=internal && sub!==null && supportPins.has(connection.name) ? '#' : '';
        const key=connection.name+(sub || '')+suffix;
        if (keys.has(key)) throw new Error(`Unknown names collide: ${key}`);
        keys.add(key);
        const normal=sub==='x' ? {x:1,y:0} : sub==='y' ? {x:0,y:1} : connection.normal;
        if (!normal || !Number.isFinite(normal.x) || !Number.isFinite(normal.y) ||
            Math.abs(Math.hypot(normal.x,normal.y)-1)>1e-9) {
          throw new Error(`Contact ${connection.name} needs a unit normal`);
        }
        const ids=internal ? connection.members : [connection.member];
        const terms=ids.map((member,i) => ({
          name:connection.name, sub, kind:internal?'pin':'reaction', member,
          at:resolvePoint(fig,connection.drawAt?.[member] || connection.at),
          vec:{x:(i===0?1:-1)*normal.x,y:(i===0?1:-1)*normal.y},
          unilateral:connection.oneSided===true
        }));
        unknowns.push({key,connection,terms});
      }
    }
  }
  const n=3*fig.members.length;
  if (unknowns.length!==n) throw new Error(`Expected ${n} unknowns, got ${unknowns.length}`);
  const matrix=Array.from({length:n},() => Array(n).fill(0));
  const rhs=Array(n).fill(0);
  function coefficients(force) {
    const row=memberRows.get(force.member);
    if (row===undefined) throw new Error(`Unknown member: ${force.member}`);
    const origin=origins[row/3];
    return {row, entries:[force.vec.x,force.vec.y,
      (force.at.x-origin.x)*force.vec.y-(force.at.y-origin.y)*force.vec.x]};
  }
  unknowns.forEach((unknown,col) => {
    for (const term of unknown.terms) {
      const {row,entries}=coefficients(term);
      entries.forEach((v,i) => { matrix[row+i][col]+=v; });
    }
  });
  const forces=fig.loads.map(load => {
    const vector=loads[load.name];
    if (!vector || !Number.isFinite(vector.x) || !Number.isFinite(vector.y)) {
      throw new Error(`Missing or invalid load: ${load.name}`);
    }
    return {name:load.name,sub:null,kind:'load',member:load.member,
      at:resolvePoint(fig,load.at),vec:{x:clean(vector.x),y:clean(vector.y)},unilateral:false};
  });
  for (const force of forces) {
    const {row,entries}=coefficients(force);
    entries.forEach((v,i) => { rhs[row+i]-=v; });
  }
  const answer=solveLinear(matrix,rhs).map(clean);
  const values={};
  const liftOff=[];
  // All one-sided figures have one load. The maximum nominal also defines a
  // stable figure-wide force scale if a later figure has several applied loads.
  const nominal=Math.max(0,...fig.loads.map(load => Math.hypot(load.nominal.x,load.nominal.y)));
  unknowns.forEach((unknown,i) => {
    values[unknown.key]=answer[i];
    if (unknown.connection.oneSided && answer[i]<-1e-9*nominal) liftOff.push(unknown.connection.name);
    for (const term of unknown.terms) {
      forces.push({...term,vec:{x:clean(term.vec.x*answer[i]),y:clean(term.vec.y*answer[i])}});
    }
  });
  liftOff.sort();
  return {ok:liftOff.length===0,liftOff,values,forces};
}

// A two-force member has exactly two connections (supports or joints), no load and no contact: its two end forces are
// equal, opposite and along the line between the two points. Found from the figure data, never by name.
function twoForceMembers(fig) {
  return fig.members.filter(m => {
    const mine=[...fig.supports.filter(s => s.member===m.id),...fig.joints.filter(j => j.members.includes(m.id))];
    return mine.length===2 && !mine.some(c => c.kind==='contact') && !fig.loads.some(l => l.member===m.id);
  }).map(m => m.id);
}

// What is drawn: the solved forces with, on a two-force member, the x and y components of each end merged into ONE force
// along the member (the other member's half of a joint pair at that end merges too, so the pair stays equal and opposite).
// The list's order and length depend only on the figure. role: 'load' | 'component' | 'link' | 'normal'.
function displayForces(fig, forces) {
  const links=new Set(twoForceMembers(fig));
  const jointOf=name => fig.joints.find(j => j.name===name);
  const merged=new Map(), out=[];
  for (const f of forces) {
    if (f.kind==='load') { out.push({...f,role:'load'}); continue; }
    const connection=f.kind==='pin' ? jointOf(f.name) : fig.supports.find(s => s.name===f.name);
    if (connection.kind==='contact') { out.push({...f,role:'normal'}); continue; }
    const ends=f.kind==='pin' ? connection.members : [connection.member];
    if (!ends.some(id => links.has(id))) { out.push({...f,role:'component'}); continue; }
    const key=`${f.kind}|${f.name}|${f.member}`;
    if (!merged.has(key)) {
      const link=links.has(f.member) ? f.member : ends.find(id => links.has(id));
      const mine=[...fig.supports.filter(s => s.member===link),...fig.joints.filter(j => j.members.includes(link))];
      const [p,q]=mine.map(c => resolvePoint(fig,c.at)), u={x:p.x-q.x,y:p.y-q.y}, len=Math.hypot(u.x,u.y);
      const entry={...f,sub:null,vec:{x:0,y:0},role:'link',axis:{x:u.x/len,y:u.y/len},sum:{x:0,y:0}};
      merged.set(key,entry); out.push(entry);
    }
    const entry=merged.get(key);
    entry.sum.x+=f.vec.x; entry.sum.y+=f.vec.y;
  }
  // Project the summed force onto the member's axis: equilibrium makes it parallel (to rounding), so this only removes noise.
  for (const entry of merged.values()) {
    const along=entry.sum.x*entry.axis.x+entry.sum.y*entry.axis.y;
    entry.vec={x:clean(along*entry.axis.x),y:clean(along*entry.axis.y)};
    delete entry.axis; delete entry.sum;
  }
  return out;
}

// ===== svg.js =====
// Adapted from joint_explode's SVG helpers. All geometry uses figure units;
// these two functions are the only conversion between y-up and SVG y-down.
const NS = 'http://www.w3.org/2000/svg';

  member:'#cfe3ee', outline:'#3b82a6', pin:'#9ca3af', pinOutline:'#374151',

// One hue per third-law pair (a joint): both halves of the pair share it. Each is at least 3:1 on white and none is the
// load red, the reaction blue or the lift-off grey (a test checks all of that).
const PAIR_COLOURS = ['#a21caf','#15803d','#b45309','#0e7490'];

function clearNode(node) {
  while (node.firstChild) node.removeChild(node.firstChild);

// The spoken form of a label: a lowered segment is read "sub", and `say` spells it out ("Ax" is said "A x", so a reader does
// not pronounce it as a word).
function spokenText(segs) {
  return segs.map(s=>(s.sub?' sub ':'')+(s.say ?? s.t)).join('');
}

// A lowered tspan, not a Unicode glyph or an ASCII suffix. A spoken name
// replaces the concatenated glyphs so a reader does not pronounce "Ax" as a word.
// opts.plain: running text (upright, the page's own font) instead of an italic symbol.

  const split=list.some(s=>s.sub), size=opts.size ?? 1;

    x,y,class:'t', id:opts.id || null, 'font-size':size,'font-family':opts.plain?null:'serif','font-style':opts.plain?null:'italic',

  },parent);

    span.textContent=s.t;

// Explicit shaft and head avoid marker scaling and keep the tip exactly at to.
// Cap the head by the actual length: very small nonzero arrows never reverse.
function arrow(parent, from, to, opts = {}) {
  const dx=to.x-from.x, dy=to.y-from.y, len=Math.hypot(dx,dy);
  if (len===0) return;
  const ux=dx/len, uy=dy/len, head=Math.min(opts.head ?? 0.2,len*0.45);
  const base={x:to.x-ux*head,y:to.y-uy*head}, wing=head*0.52;
  const colour=opts.fill || PALETTE.ink;
  el('line',{
    x1:from.x,y1:from.y,x2:base.x,y2:base.y,stroke:colour,
    'stroke-width':opts.width ?? 0.05,'stroke-linecap':'butt'
  },parent);
  el('polygon',{
    points:`${to.x},${to.y} ${base.x-uy*wing},${base.y+ux*wing} ${base.x+uy*wing},${base.y-ux*wing}`,
    fill:colour
  },parent);
}

// ===== layout.js =====




// ---- the page layout: geometry fills the window, text and strokes stay one screen size ----------------------------
// Everything a figure can draw, over every load it can reach, has a bounding box in figure units. computeLayout()
// chooses the scale (px per unit) so that box, plus a margin in px for labels, fills the width and the height the
// window leaves. Text, arrowheads, stroke widths, handles and clearances are then drawn in px (divided by the
// scale), so only the geometry and the arrows (length proportional to force) grow with the window.
const MARGIN_PX=34;      // room round the content for labels beside the outermost arrows
const STRIP_PX=28;       // extra room at the bottom for the lift-off line (figures with a one-sided contact)
const PAGE_RESERVE_PX=96; // body padding, button and gap above the figure
const DEFAULT_WIDTH_PX=340;
const DEFAULT_HEIGHT_PX=716;

const boundsCache=new Map();

const memberPoints=(fig,member)=>member.path.flatMap(seg=>seg.seg==='arc' ? sampleArc(fig,seg,48) : [resolvePoint(fig,seg.from),resolvePoint(fig,seg.to)]);
const explodeOffset=(fig,id,frac)=>{ const o=fig.view.explode[id] || {dx:0,dy:0}; return {dx:frac*o.dx,dy:frac*o.dy}; };

// The frame's own bounding box (figure units, y up): members (with their width), supports and balls, over both
// explode fractions, no arrows. With `frac` given, only that state.
function frameBounds(fig, frac = null) {
  const box={x0:Infinity,x1:-Infinity,y0:Infinity,y1:-Infinity};
  const add=(x,y)=>{ box.x0=Math.min(box.x0,x); box.x1=Math.max(box.x1,x); box.y0=Math.min(box.y0,y); box.y1=Math.max(box.y1,y); };
  for (const f of frac===null ? [0,1] : [frac]) {
    for (const member of fig.members) {
      const o=explodeOffset(fig,member.id,f), r=member.width/2;
      for (const p of memberPoints(fig,member)) { add(p.x+o.dx-r,p.y+o.dy-r); add(p.x+o.dx+r,p.y+o.dy+r); }
    }
    for (const support of fig.supports) {
      const o=explodeOffset(fig,support.member,f), p=resolvePoint(fig,support.at); add(p.x+o.dx,p.y+o.dy);
    }
    for (const ball of fig.balls) {
      // a ball in a joint sits between its members, half way between their offsets; a support ball rides its member
      const joint=fig.joints.find(j=>j.name===ball.name), support=fig.supports.find(s=>s.name===ball.name);
      const offs=joint ? joint.members.map(id=>explodeOffset(fig,id,f)) : [explodeOffset(fig,support.member,f)];
      const dx=offs.reduce((n,o)=>n+o.dx,0)/offs.length, dy=offs.reduce((n,o)=>n+o.dy,0)/offs.length;
      add(ball.at.x+dx-ball.r,ball.at.y+dy-ball.r); add(ball.at.x+dx+ball.r,ball.at.y+dy+ball.r);
    }
  }
  return box;
}

// Every drawn force's head position at each explode fraction, and the extremes of its vector over every load the student can
// set (each load 0 or up to LOAD_CAP x nominal, 72 directions, independently). A force is linear in the loads, so the
// extreme of a sum over independent loads is the sum of each load's extreme. Arrow tails are head - vec * arrowPerForce.
function forceExtremes(fig) {
  const zero=Object.fromEntries(fig.loads.map(l=>[l.name,{x:0,y:0}]));
  const responses=fig.loads.map(load=>{
    const m=LOAD_CAP*Math.hypot(load.nominal.x,load.nominal.y);
    return Array.from({length:72},(_,i)=>{
      const a=i*Math.PI/36;
      return displayForces(fig,solve(fig,{...zero,[load.name]:{x:m*Math.cos(a),y:m*Math.sin(a)}}).forces);
    });
  });
  const base=displayForces(fig,solve(fig,zero).forces), out=[];
  for (const frac of [0,1]) base.forEach((force,i)=>{
    const o=explodeOffset(fig,force.member,frac);
    let loX=0, hiX=0, loY=0, hiY=0;
    for (const list of responses) {
      let a=0, b=0, c=0, d=0;
      for (const resp of list) { const v=resp[i].vec; a=Math.min(a,v.x); b=Math.max(b,v.x); c=Math.min(c,v.y); d=Math.max(d,v.y); }
      loX+=a; hiX+=b; loY+=c; hiY+=d;
    }
    out.push({hx:force.at.x+o.dx,hy:force.at.y+o.dy,loX,hiX,loY,hiY});
  });
  return out;
}
const extremesCache=new Map();
const extremes=fig=>{
  const key=`${fig.id}|${JSON.stringify(fig.view.explode)}`;
  if (!extremesCache.has(key)) extremesCache.set(key,forceExtremes(fig));
  return extremesCache.get(key);
};

// Todd's rule (2026-11-10, option B): the arrow scale is chosen so that the worst-case arrows stick out of the frame's
// own bounding box by at most ARROW_MARGIN x the frame's extent along that axis, on every side. It is the largest arrowPerForce
// with that property. Each figure stores the rule's value rounded down to 3 significant figures (a test checks it).
const ARROW_MARGIN=0.2;
// A figure may set view.arrowMargin when the shared margin leaves its textbook-load arrow under the 24 px floor.
function chooseArrowScale(fig, margin = fig.view.arrowMargin ?? ARROW_MARGIN) {
  const F=frameBounds(fig), mx=margin*(F.x1-F.x0), my=margin*(F.y1-F.y0);
  let s=Infinity;
  for (const {hx,hy,loX,hiX,loY,hiY} of extremes(fig)) {
    // tail x = hx - v*s for v in [loX,hiX]; it must stay within [F.x0-mx, F.x1+m] (likewise y)
    if (hiX>0) s=Math.min(s,(hx-(F.x0-mx))/hiX);
    if (loX<0) s=Math.min(s,((F.x1+mx)-hx)/-loX);
    if (hiY>0) s=Math.min(s,(hy-(F.y0-my))/hiY);
    if (loY<0) s=Math.min(s,((F.y1+my)-hy)/-loY);
  }
  return s;
}
const roundDown3=v=>{ const e=Math.pow(10,Math.floor(Math.log10(v))-2); return Math.floor(v/e+1e-9)*e; };

// Bounding box (figure units, y up) of the frame and the tail of every arrow over every reachable load, combined and
// exploded.
function contentBounds(fig) {
  const key=`${fig.id}|${fig.view.arrowPerForce}|${JSON.stringify(fig.view.explode)}`;
  if (boundsCache.has(key)) return boundsCache.get(key);
  const box={...frameBounds(fig)}, s=fig.view.arrowPerForce;
  const add=(x,y)=>{ box.x0=Math.min(box.x0,x); box.x1=Math.max(box.x1,x); box.y0=Math.min(box.y0,y); box.y1=Math.max(box.y1,y); };
  for (const {hx,hy,loX,hiX,loY,hiY} of extremes(fig)) {
    add(hx,hy);
    // the tail is the head minus vec * scale
    add(hx-hiX*s,hy-hiY*s); add(hx-loX*s,hy-loY*s);
  }
  boundsCache.set(key,box);
  return box;
}

function hasOneSided(fig) {
  return [...fig.supports,...fig.joints].some(c=>c.oneSided);
}

// width, availableHeight in px. Returns the viewBox (SVG coordinates, y down), the scale in px per unit and the
// svg's height in px (shrunk to the content when the width is the limit, so a phone gets no empty space).
function computeLayout(fig, width, availableHeight) {
  const B=contentBounds(fig), strip=hasOneSided(fig) ? STRIP_PX : 0, M=MARGIN_PX;
  const bw=Math.max(B.x1-B.x0,1e-6), bh=Math.max(B.y1-B.y0,1e-6);
  const scale=Math.max(1e-3,Math.min((width-2*M)/bw,(availableHeight-2*M-strip)/bh));
  const height=Math.min(availableHeight,bh*scale+2*M+strip);
  const vw=width/scale, vh=height/scale;
  const top=(height-strip-bh*scale)/2;
  return {viewBox:[(B.x0+B.x1)/2-vw/2,-B.y1-top/scale,vw,vh],scale,width,height};
}

// Label placement in SVG coordinates (y down), figure units.
//
// A label is a box. Candidate boxes sit on rings around the arrow's tail, on the
// side away from the arrow first, then turning round it; the first candidate that
// is inside the view and clear of every obstacle and of every earlier label wins.
// Obstacles are capsules (a segment with a radius; a circle has a === b) or plain
// boxes, so arrow shafts and heads, member bars (chains of capsules), handle rings
// and the lift-off line are all the same kind of thing. The rules are shared by
// all six figures: nothing here is figure-specific.
function capsuleHitsBox(c, box) {
  const {a,b,r}=c;
  const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
  const x0=box.x, x1=box.x+box.w, y0=box.y, y1=box.y+box.h;
  // Sample the segment at a step below r: a capsule is thin.
  const step=Math.max(r*0.5,1e-6), n=len2===0 ? 0 : Math.min(400,Math.ceil(Math.sqrt(len2)/step));
  for (let i=0; i<=n; i++) {
    const t=n===0 ? 0 : i/n, px=a.x+dx*t, py=a.y+dy*t;
    const qx=Math.max(x0,Math.min(px,x1)), qy=Math.max(y0,Math.min(py,y1));
    if ((px-qx)**2+(py-qy)**2<r*r) return true;
  }
  return false;
}

// place(tail, away, width, height, gap, head, shaftGap) -> box. A label names its arrow, so it must sit by it: candidates
// are ordered by how far the box's nearest edge is from the arrow (`gap` from the tail, then ring by ring, and `gap`
// from the shaft at three places along it). The first clear one inside the view wins. If none is clear inside the view
// the nearest clear candidate outside it is used (and the browser harness reports that).
function createLabelPlacer(bounds = null, obstacles = []) {
  const boxes=[];
  const overlaps=(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
  const clear=box=>!boxes.some(b=>overlaps(box,b)) &&
    !obstacles.some(o=>o.box ? overlaps(box,o.box) : capsuleHitsBox(o,box));
  const inside=box=>!bounds || (box.x>=bounds.x && box.y>=bounds.y &&
    box.x+box.w<=bounds.x+bounds.w && box.y+box.h<=bounds.y+bounds.h);
  return function place(tail, away, width, height, gap, head = null, shaftGap = gap) {
    const len=Math.hypot(away.x,away.y);
    const u=len ? {x:away.x/len,y:away.y/len} : {x:0,y:-1};
    const step=0.1*height, rings=20;
    const candidates=[];
    // Box whose nearest edge is `distance` from `anchor` in direction d (a unit vector).
    const around=(anchor,d,distance)=>{
      const reach=Math.abs(d.x)*width/2+Math.abs(d.y)*height/2;
      return {x:anchor.x+d.x*(distance+reach)-width/2,y:anchor.y+d.y*(distance+reach)-height/2,w:width,h:height};
    };
    const angles=[0];
    for (let k=1; k<=23; k++) angles.push(k*Math.PI/24,-k*Math.PI/24);
    angles.push(Math.PI);
    let order=0;
    for (let ring=0; ring<rings; ring++) {
      for (const angle of angles) {
        const d={x:u.x*Math.cos(angle)-u.y*Math.sin(angle),y:u.x*Math.sin(angle)+u.y*Math.cos(angle)};
        candidates.push({cost:gap+ring*step,order:order++,box:around(tail,d,gap+ring*step)});
      }
      if (head) {
        const dx=head.x-tail.x, dy=head.y-tail.y, l=Math.hypot(dx,dy);
        if (l>0.7*height) {
          const n={x:-dy/l,y:dx/l};
          for (const t of [0.15,0.3,0.45,0.6,0.75,0.9]) for (const side of [1,-1]) {
            const p={x:tail.x+dx*t,y:tail.y+dy*t}, d={x:n.x*side,y:n.y*side};
            candidates.push({cost:shaftGap+ring*step,order:order++,box:around(p,d,shaftGap+ring*step)});
          }
        }
      }
    }
    candidates.sort((a,b)=>a.cost-b.cost || a.order-b.order);
    let fallback=null;
    for (const c of candidates) {
      if (!clear(c.box)) continue;
      if (inside(c.box)) { boxes.push(c.box); return Object.assign(c.box,{cost:c.cost}); }
      fallback ||= c.box;
    }
    // Nothing fits inside the view: keep the labels apart and let the harness say so.
    if (!fallback) fallback={x:tail.x-width/2,y:tail.y-height/2-gap,w:width,h:height};
    boxes.push(fallback);
    return Object.assign(fallback,{cost:Infinity});
  };
}

// ===== scene.js =====






// Sizes in screen px, at every viewport: text, arrowheads, strokes, handles and clearances are drawn as
// (px / scale) figure units, where scale (px per unit) comes from computeLayout(). Only the geometry and the
// arrows (length proportional to force) grow with the window. Label text is 16 px, its subscript 12.8 px,
// and a handle's hit circle is 46 px across.
const LABEL_PX=16;
const HANDLE_PX=23;
const RING_PX=10;
// The focus halo drawn round a focused handle; labels keep clear of all of it.
const HALO_PX=RING_PX+7;

function memberOffset(fig, memberId, frac) {
  const offset=fig.view.explode[memberId] || {dx:0,dy:0};
  return {dx:frac*offset.dx,dy:frac*offset.dy};
}

function loadHandlePos(fig, state, name, frac) {
  const load=fig.loads.find(l=>l.name===name);
  const at=resolvePoint(fig,load.at), offset=memberOffset(fig,load.member,frac), vec=state.loads[name];
  return {x:at.x+offset.dx-vec.x*fig.view.arrowPerForce,
    y:at.y+offset.dy-vec.y*fig.view.arrowPerForce};
}

function memberTransform(fig, id, frac) {
  const offset=memberOffset(fig,id,frac), p=toSvg({x:offset.dx,y:offset.dy});
  return `translate(${p.x} ${p.y})`;
}

function scenePath(fig, member) {
  return member.path.map(segment=>{
    const points=segment.seg==='arc' ? sampleArc(fig,segment,64) :
      [resolvePoint(fig,segment.from),resolvePoint(fig,segment.to)];
    return points.map((p,i)=>{ const s=toSvg(p); return `${i?'L':'M'} ${s.x} ${s.y}`; }).join(' ');
  }).join(' ');
}

function sceneCircle(parent, point, r, attrs = {}) {
  const p=toSvg(point);
  return el('circle',{cx:p.x,cy:p.y,r,fill:PALETTE.pin,stroke:PALETTE.pinOutline,...attrs},parent);
}

// A tan surface band, oriented independently of the force being applied.
function sceneGround(parent, at, normal, halfWidth, depth, surface) {
  const tangent={x:normal.y,y:-normal.x};
  const points=[[-halfWidth,0],[halfWidth,0],[halfWidth,-depth],[-halfWidth,-depth]].map(([s,t])=>{
    const p=toSvg({x:at.x+tangent.x*s+normal.x*t,y:at.y+tangent.y*s+normal.y*t});
    return `${p.x},${p.y}`;
  });
  el('polygon',{points:points.join(' '),fill:PALETTE.ground,class:'ground','data-surface':surface},parent);
  return boxOf(points.map(p=>{ const [x,y]=p.split(',').map(Number); return {x,y}; }));
}

function boxOf(points) {
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
}

function supportMounts(fig, sol, px) {
  const mounts=fig.supports.map(support=>{
    const normal=support.surface==='wall-left'?{x:1,y:0}:{x:0,y:1};
    const at=resolvePoint(fig,support.drawAt?.[support.member] || support.at);
    const gap=sol.liftOff.includes(support.name)?0.16+0.75/px:0;
    const ball=fig.balls.find(b=>b.name===support.name);
    // A ball keeps resting on the floor when its contact lets go, so the floor does not move: the ball shrinks
    // by `gap` (its underside stays put, its top drops `gap` below the member). A roller is too small to shrink,
    // so it drops by `gap` instead and carries its floor with it.
    const radius=ball?ball.r-gap/2:support.kind==='pin'?8/px:6.5/px;
    const centre=ball?{x:ball.at.x-normal.x*gap/2,y:ball.at.y-normal.y*gap/2}:
      {x:at.x-normal.x*(radius+gap),y:at.y-normal.y*(radius+gap)};
    const base=support.kind==='pin'?{x:at.x-2*radius*normal.x,y:at.y-2*radius*normal.y}:
      {x:centre.x-normal.x*radius,y:centre.y-normal.y*radius};
    return {support,normal,at,radius,centre,base};
  });
  // Supports of the same orientation share a surface. A short mounting pad
  // bridges differing bracket heights, rather than drawing separate floors.
  for (const mount of mounts) {
    const {normal,base,support}=mount;
    const plane=Math.min(...mounts.filter(m=>m.support.surface===support.surface)
      .map(m=>m.base.x*normal.x+m.base.y*normal.y));
    const extension=plane-base.x*normal.x-base.y*normal.y;
    mount.foot={x:base.x+normal.x*extension,y:base.y+normal.y*extension};
  }
  return mounts;
}

function drawSurfaces(parent, fig, mounts, frac, px) {
  // One interval along each support's surface. Combined, supports on one plane share one band: each
  // interval reaches halfway to its neighbours, so they meet. Exploded members carry their own piece of
  // the surface with them: pieces that still touch or overlap are one band, and the rest are drawn apart.
  const info=mounts.map(mount=>{
    const {normal,foot,radius,support}=mount;
    const at0=foot.x*normal.y-foot.y*normal.x, plane0=foot.x*normal.x+foot.y*normal.y;
    return {mount,at0,key0:`${support.surface}:${plane0.toFixed(12)}`,margin:Math.max(radius*1.6,20/px)};
  });
  const intervals=[];
  for (const item of info) {
    const {normal,foot,support}=item.mount;
    const mates=info.filter(o=>o!==item && o.key0===item.key0);
    const below=mates.filter(o=>o.at0<item.at0).map(o=>(item.at0-o.at0)/2);
    const above=mates.filter(o=>o.at0>item.at0).map(o=>(o.at0-item.at0)/2);
    const offset=memberOffset(fig,support.member,frac);
    const point={x:foot.x+offset.dx,y:foot.y+offset.dy};
    const plane=point.x*normal.x+point.y*normal.y;
    const along=point.x*normal.y-point.y*normal.x;
    intervals.push({key:`${support.surface}:${plane.toFixed(12)}`,normal,plane,surface:support.surface,
      lo:along-(below.length ? Math.max(item.margin,Math.min(...below)) : item.margin),
      hi:along+(above.length ? Math.max(item.margin,Math.min(...above)) : item.margin)});
  }
  intervals.sort((a,b)=>a.key<b.key ? -1 : a.key>b.key ? 1 : a.lo-b.lo);
  const pieces=[];
  for (const band of intervals) {
    const last=pieces[pieces.length-1];
    if (last && last.key===band.key && band.lo<=last.hi+1e-9) last.hi=Math.max(last.hi,band.hi);
    else pieces.push({...band});
  }
  return pieces.map(({normal,plane,surface,lo,hi})=>{
    const middle=(lo+hi)/2;
    return sceneGround(parent,{x:normal.x*plane+normal.y*middle,y:normal.y*plane-normal.x*middle},
      normal,(hi-lo)/2,8/px,surface);
  });
}

function drawSupport(parent, fig, mount, frac, px) {
  const {support,normal,at,base,foot,radius,centre}=mount;
  const group=el('g',{class:'g support','data-name':support.name,'data-member':support.member,
    transform:memberTransform(fig,support.member,frac)},parent);
  const tangent={x:normal.y,y:-normal.x};
  const side=(p,sign)=>toSvg({x:p.x+sign*tangent.x*radius,y:p.y+sign*tangent.y*radius});
  const offset=memberOffset(fig,support.member,frac), boxes=[];
  const shifted=points=>boxOf(points.map(p=>({x:p.x+offset.dx,y:p.y-offset.dy})));
  if (Math.hypot(base.x-foot.x,base.y-foot.y)>1e-9) {
    boxes.push(shifted([side(base,-1),side(base,1),side(foot,1),side(foot,-1)]));
    const points=[side(base,-1),side(base,1),side(foot,1),side(foot,-1)];
    el('polygon',{class:'support-pad',points:points.map(p=>`${p.x},${p.y}`).join(' '),
      fill:PALETTE.pin,stroke:PALETTE.pinOutline,'stroke-width':1.5/px},group);
  }
  if (support.kind==='pin') {
    const top=toSvg(at), left=side(base,-1), right=side(base,1);
    boxes.push(shifted([top,left,right]));
    el('polygon',{class:'support-pin',points:`${top.x},${top.y} ${left.x},${left.y} ${right.x},${right.y}`,
      fill:PALETTE.pin,stroke:PALETTE.pinOutline,'stroke-width':1.5/px},group);
  } else if (support.label!=='Ball') {
    sceneCircle(group,centre,radius,{class:'roller','data-name':support.name,'stroke-width':1.5/px});
    const c=toSvg(centre);
    boxes.push(shifted([{x:c.x-radius,y:c.y-radius},{x:c.x+radius,y:c.y+radius}]));
  }
  return boxes;
}

function drawBalls(parent, fig, sol, frac, mounts, px) {
  const obstacles=[], circles=[];
  for (const ball of fig.balls) {
    const joint=fig.joints.find(j=>j.name===ball.name);
    const support=fig.supports.find(s=>s.name===ball.name);
    const lifted=sol.liftOff.includes(ball.name);
    const gap=0.16+0.75/px; // include half the ball outline
    let centre={...ball.at}, radius=ball.r;
    if (joint) {
      // A free ball between the separated arms, not a child of either member.
      const offsets=joint.members.map(id=>memberOffset(fig,id,frac));
      centre.x+=offsets.reduce((n,p)=>n+p.dx,0)/offsets.length;
      centre.y+=offsets.reduce((n,p)=>n+p.dy,0)/offsets.length;
      // Inset the contact symbol on loss of equilibrium to show both gaps
      // without moving the members or changing the statics geometry.
      if (lifted) radius=Math.max(0.05,radius-gap);
    } else if (support) {
      const mount=mounts.find(m=>m.support===support);
      centre={...mount.centre}; radius=mount.radius;
      const offset=memberOffset(fig,support.member,frac);
      centre.x+=offset.dx; centre.y+=offset.dy;
    }
    sceneCircle(parent,centre,radius,{class:'ball','data-name':ball.name,'stroke-width':1.5/px});
    const c=toSvg(centre);
    obstacles.push({a:c,b:c,r:radius+1.75/px}); // outline plus one pixel of label clearance
    circles.push({name:ball.name,c,r:radius+0.75/px}); // with half the outline, as the harness measures it
  }
  return {obstacles,circles};
}

function forcePoint(fig, force, frac) {
  const offset=memberOffset(fig,force.member,frac);
  return {x:force.at.x+offset.dx,y:force.at.y+offset.dy};
}

// Every force is F + subscript, never a bare joint letter: pin and support components F_Ax, F_Ay; the force of a two-force
// member F_B (named for the joint); a roller or ball normal force N_E. Loads stay P and Q. A subscript carries its spoken form.
function forceSegs(force) {
  if (force.role==='load') return [{t:force.name}];
  if (force.role==='normal') return [{t:'N'},{t:force.name,sub:true}];
  if (force.role==='link') return [{t:'F'},{t:force.name,sub:true}];
  return [{t:'F'},{t:force.name+force.sub,sub:true,say:`${force.name} ${force.sub}`}];
}

// The hue of a third-law pair: one per joint, in the figure's joint order.
function pairColour(fig, name) {
  return PAIR_COLOURS[Math.max(0,fig.joints.findIndex(j=>j.name===name))%PAIR_COLOURS.length];
}

// "N_F lifts off: no equilibrium." as label segments (real subscripts on screen); liftOffText is its spoken form
// ("N sub F lifts off: no equilibrium.") for the status region and the aria-label.
// The reserved box of a force label in em: wider for a two-letter subscript (F_Ax), taller when anything is lowered.
function labelEm(force) {
  if (force.role==='load') return [0.8,1.2];
  return [(forceSegs(force).find(g=>g.sub)?.t.length ?? 0)>1 ? 1.55 : 1.2,1.45];
}

function liftOffSegs(fig, sol) {
  if (sol.ok) return [];
  const segs=[];
  sol.liftOff.forEach((name,i)=>{
    if (i>0) segs.push({t:' and '});
    segs.push({t:'N'},{t:name,sub:true});
  });
  segs.push({t:` ${sol.liftOff.length===1?'lifts':'lift'} off: no equilibrium.`});
  return segs;
}
function liftOffText(fig, sol) {
  return spokenText(liftOffSegs(fig,sol));
}

function loadDirectionText(vec) {
  if (vec.x===0 && vec.y===0) return 'zero';
  const vertical=vec.y>0 ? 'up' : vec.y<0 ? 'down' : '';
  const horizontal=vec.x>0 ? 'right' : vec.x<0 ? 'left' : '';
  return `pointing ${vertical && horizontal ? `${vertical} and to the ${horizontal}` : vertical || horizontal}`;
}

// The svg fills the width of its column and the height the window leaves; the viewBox is chosen so that one unit is
// `scale` px in both directions. Without a layout engine (the Node tests) a phone-sized column is assumed.
function render(svgEl, fig, state, sol, frac) {
  clearNode(svgEl);
  const width=svgEl.clientWidth>0 ? svgEl.clientWidth : DEFAULT_WIDTH_PX;
  const inner=globalThis.innerHeight>0 ? globalThis.innerHeight-PAGE_RESERVE_PX : DEFAULT_HEIGHT_PX;
  const layout=computeLayout(fig,width,Math.max(200,inner)), px=layout.scale;
  const [x,y,w,h]=layout.viewBox;
  svgEl.setAttribute('viewBox',layout.viewBox.join(' '));
  svgEl.setAttribute('style',`height:${layout.height}px`);
  svgEl.setAttribute('data-scale',px);
  svgEl.setAttribute('role','group');
  svgEl.setAttribute('aria-label',`Frame ${fig.id} and its forces`);

  const mounts=supportMounts(fig,sol,px);
  const surfaces=el('g',{class:'g surfaces'},svgEl);
  drawSurfaces(surfaces,fig,mounts,frac,px); // a label may sit on the tan wall or floor band; it keeps clear of support glyphs
  const fixed=[];
  const supports=el('g',{class:'g supports'},svgEl);
  for (const mount of mounts) for (const box of drawSupport(supports,fig,mount,frac,px)) fixed.push({box});
  for (const member of fig.members) {
    const group=el('g',{class:'g member','data-member':member.id,transform:memberTransform(fig,member.id,frac)},svgEl);
    const d=scenePath(fig,member);
    // The specified member width includes the outline, so drawAt describes
    // the visible outer surface exactly.
    for (const [stroke,width] of [[PALETTE.outline,member.width],[PALETTE.member,Math.max(member.width*0.5,member.width-4/px)]]) {
      el('path',{d,fill:'none',stroke,'stroke-width':width,'stroke-linecap':'round','stroke-linejoin':'round'},group);
    }
  }
  const pins=el('g',{class:'g pins'},svgEl);
  for (const connection of [...fig.supports,...fig.joints]) {
    if (connection.kind!=='pin') continue;
    const ids=connection.members || [connection.member];
    for (const id of ids) {
      const at=resolvePoint(fig,connection.at), offset=memberOffset(fig,id,frac);
      sceneCircle(pins,{x:at.x+offset.dx,y:at.y+offset.dy},5/px,{class:'pin','stroke-width':1.5/px});
    }
  }

  const balls=el('g',{class:'g balls'},svgEl);
  const {obstacles:ballObstacles,circles:ballCircles}=drawBalls(balls,fig,sol,frac,mounts,px);
  const size=LABEL_PX/px, drawn=[];
  for (const force of displayForces(fig,sol.forces)) {
    if (force.kind==='pin' && frac===0) continue;
    const greyed=!sol.ok && force.kind!=='load';
    const lost=force.unilateral && sol.liftOff.includes(force.name);
    const colour=greyed ? PALETTE.greyed : force.kind==='pin' ? pairColour(fig,force.name) : PALETTE[force.kind];
    const group=el('g',{class:`g force ${force.kind==='pin'?'pin':force.kind}-force${greyed?' greyed':''}`,
      'data-name':force.name,'data-sub':force.sub,'data-member':force.member,'data-role':force.role,
      opacity:force.kind==='pin'?frac:1},svgEl);
    const at=forcePoint(fig,force,frac), head=toSvg(at);
    const vec=lost?{x:0,y:0}:force.vec;
    const tail=toSvg({x:at.x-vec.x*fig.view.arrowPerForce,y:at.y-vec.y*fig.view.arrowPerForce});
    const zero=vec.x===0 && vec.y===0;
    if (zero) {
      el('circle',{cx:head.x,cy:head.y,r:5/px,class:'zero',fill:'none',stroke:colour,
        'stroke-width':1.5/px,'stroke-dasharray':`${4/px} ${3/px}`,opacity:0.5},group);
    } else arrow(group,tail,head,{fill:colour,width:3/px,head:11/px});
    drawn.push({force,colour,tail,head,zero});
  }
  // Everything a label must stay clear of: every arrow (shaft and head), every
  // member bar, ball, handle ring and the lift-off line.
  const pad=1/px; // clearance around grounds and supports
  const obstacles=fixed.map(({box})=>({box:{x:box.x-pad,y:box.y-pad,w:box.w+2*pad,h:box.h+2*pad}}));
  obstacles.push(...ballObstacles);
  // The joint pins drawn on the members.
  for (const connection of [...fig.supports,...fig.joints]) {
    if (connection.kind!=='pin') continue;
    for (const id of connection.members || [connection.member]) {
      const at=resolvePoint(fig,connection.at), o=memberOffset(fig,id,frac), c=toSvg({x:at.x+o.dx,y:at.y+o.dy});
      obstacles.push({a:c,b:c,r:5.8/px});
    }
  }
  for (const {tail,head,zero} of drawn) {
    if (zero) { obstacles.push({a:head,b:head,r:6/px}); continue; }
    const len=Math.hypot(head.x-tail.x,head.y-tail.y), headLen=Math.min(11/px,len*0.45), k=headLen/len;
    const base={x:head.x+(tail.x-head.x)*k,y:head.y+(tail.y-head.y)*k};
    obstacles.push({a:tail,b:base,r:2.2/px},{a:base,b:head,r:5.4/px});
  }
  for (const member of fig.members) {
    const offset=memberOffset(fig,member.id,frac), pts=[];
    for (const segment of member.path) {
      const raw=segment.seg==='arc' ? sampleArc(fig,segment,32) :
        [resolvePoint(fig,segment.from),resolvePoint(fig,segment.to)];
      for (const p of raw) pts.push(toSvg({x:p.x+offset.dx,y:p.y+offset.dy}));
    }
    for (let i=1; i<pts.length; i++) obstacles.push({a:pts[i-1],b:pts[i],r:member.width/2+1/px});
  }
  for (const load of fig.loads) {
    const p=toSvg(loadHandlePos(fig,state,load.name,frac));
    obstacles.push({a:p,b:p,r:(HALO_PX+1)/px});
  }
  if (!sol.ok) {
    // About 0.55 em per character is generous for the system font.
    const text=liftOffSegs(fig,sol).map(g=>g.t).join(''), w=text.length*0.55*16/px;
    obstacles.push({box:{x:x+12/px,y:y+h-12/px-16/px,w,h:21/px}});
  }
  // Place every label beside its own arrow. Labels are placed one after another, so an early one can take the only spot
  // a later one could use: try a few orders and keep the one that leaves the fewest labels far from their arrows.
  const nearPx=16/px;
  // A contact force drawn inside its own ball is owned by the arrow and the ball's outline together (the harness measures the
  // same union): its label hugs the ball, on the side away from the arrowhead, clear of a floor band under it.
  const requests=drawn.map(({force,tail,head,zero})=>({force,tail,head,zero,
    away:{x:tail.x-head.x,y:tail.y-head.y},len:Math.hypot(head.x-tail.x,head.y-tail.y),
    ball:zero ? null : ballCircles.find(b=>b.name===force.name && Math.hypot(tail.x-b.c.x,tail.y-b.c.y)<b.r)}));
  const attempt=order=>{
    const place=createLabelPlacer({x,y,w,h},obstacles), result=new Array(requests.length);
    let score=0;
    for (const i of order) {
      const {force,tail,head,zero,away,ball}=requests[i];
      const [wide,tall]=labelEm(force);
      // 6 px from the shaft; a load's label clears its handle ring at the tail.
      const box=ball ? place(ball.c,away,size*wide,size*tall,ball.r+10/px) :
        place(tail,away,size*wide,size*tall,(force.kind==='load'?HALO_PX+1.5:6)/px,zero ? null : head,6/px);
      result[i]=box; score+=box.cost>nearPx ? 1+Math.min(box.cost,1e3)/1e4 : 0;
    }
    return {result,score};
  };
  const indices=requests.map((_,i)=>i);
  const orders=[indices,[...indices].reverse(),[...indices].sort((a,b)=>requests[a].len-requests[b].len),
    [...indices].sort((a,b)=>requests[b].len-requests[a].len),
    // loads first (their labels must also clear the handle halo), then the rest, and the reverse of each
    [...indices].sort((a,b)=>(requests[b].force.kind==='load')-(requests[a].force.kind==='load')),
    [...indices].sort((a,b)=>(requests[a].force.kind==='load')-(requests[b].force.kind==='load')),
    indices.map((_,i)=>indices[(i+Math.floor(indices.length/2))%indices.length])];
  let best=null;
  for (const order of orders) {
    const tried=attempt(order);
    if (!best || tried.score<best.score) best=tried;
    if (best.score===0) break;
  }
  const pendingLabels=requests.map(({force},i)=>({force,box:best.result[i],colour:drawn[i].colour}));
  // Labels are a final overlay: even the last force's arrow paints below every
  // label. Preserve their original slot calculation, identity and pin fade.
  const labels=el('g',{class:'g labels'},svgEl);
  for (const {force,box,colour} of pendingLabels) {
    const group=el('g',{class:'force-label','data-name':force.name,'data-sub':force.sub,
      'data-member':force.member,'data-role':force.role,opacity:force.kind==='pin'?frac:1},labels);
    // Centred in its box, so the text sits as near the arrow as the box does.
    label(group,box.x+box.w/2,box.y+(force.role==='load'?0.905:0.935)*size,forceSegs(force),{size,fill:colour,anchor:'middle'});
  }
  label(labels,x+12/px,y+h-12/px,liftOffSegs(fig,sol),{id:'liftoff',size:16/px,plain:true});
  const handles=el('g',{class:'g handles'},svgEl);
  for (const load of fig.loads) {
    const p=toSvg(loadHandlePos(fig,state,load.name,frac));
    // The hit circle is the focusable slider; the ring and halo that follow it
    // are drawn for the eye (CSS lights them from the hit circle's state).
    el('circle',{cx:p.x,cy:p.y,r:HANDLE_PX/px,class:`handle${state.held===load.name?' is-held':''}`,
      'data-load':load.name,tabindex:0,role:'slider',
      'aria-label':`Load ${load.name}, drag to change size and direction`,
      // valuenow is the size as a whole percent of this load's nominal (a number, so it is not in the spoken-text scan).
      'aria-valuenow':Math.round(100*Math.hypot(state.loads[load.name].x,state.loads[load.name].y)/Math.hypot(load.nominal.x,load.nominal.y)),
      'aria-valuemin':0,'aria-valuemax':100*LOAD_CAP,
      'aria-valuetext':loadDirectionText(state.loads[load.name]),
      fill:'transparent',stroke:PALETTE.load,'stroke-width':1.5/px},handles);
    el('circle',{cx:p.x,cy:p.y,r:RING_PX/px,class:'handle-ring','stroke-width':3/px,
      fill:'none',stroke:PALETTE.load,'pointer-events':'none'},handles);
    el('circle',{cx:p.x,cy:p.y,r:HALO_PX/px,class:'handle-halo','stroke-width':3/px,
      fill:'none','pointer-events':'none'},handles);
  }
}

// ===== state.js =====
// The largest load a student can set, in units of the textbook load (Todd, 2026-11-10: 1.5x).
const LOAD_CAP=1.5;
// Angles are radians in figure coordinates (y up). Only user inputs live here;
// the application owns transient gestures, animation progress and its solve cache.
function initialState(fig) {
  return {
    loads:Object.fromEntries(fig.loads.map(load=>[load.name,{...load.nominal}])),
    lastAngle:Object.fromEntries(fig.loads.map(load=>[load.name,Math.atan2(load.nominal.y,load.nominal.x)])),
    explodeTarget:0
  };
}

function loadVector(magnitude, angle) {
  // Remove trigonometric roundoff on the cardinal axes, including negative zero.
  const component=v=>Math.abs(v)<1e-14 ? 0 : magnitude*v;
  return {x:component(Math.cos(angle)),y:component(Math.sin(angle))};
}

function snapLoad(vec, nominal, lastAngle) {
  const magnitude=Math.min(LOAD_CAP*nominal,Math.hypot(vec.x,vec.y));
  if (magnitude<0.08*nominal || magnitude===0) return {vec:{x:0,y:0},lastAngle};
  const step=Math.PI/36;
  const angle=Math.round(Math.atan2(vec.y,vec.x)/step)*step;
  return {vec:loadVector(magnitude,angle),lastAngle:angle};
}

function ease(t) {
  const clamped=Math.max(0,Math.min(1,t));
  return clamped*clamped*(3-2*clamped);
}

// ===== drag.js =====





function pointerInFigure(svg, event) {
  // The inverse CTM includes responsive scale, page position and SVG letterboxing.
  const matrix=svg.getScreenCTM().inverse();
  return fromSvg({x:matrix.a*event.clientX+matrix.c*event.clientY+matrix.e,
    y:matrix.b*event.clientX+matrix.d*event.clientY+matrix.f});
}

function dragLoad(fig, name, point, frac, lastAngle) {
  const load=fig.loads.find(l=>l.name===name), at=resolvePoint(fig,load.at);
  const offset=memberOffset(fig,load.member,frac), scale=fig.view.arrowPerForce;
  return snapLoad({x:(at.x+offset.dx-point.x)/scale,y:(at.y+offset.dy-point.y)/scale},
    Math.hypot(load.nominal.x,load.nominal.y),lastAngle);
}

function updateDrag(app) {
  if (!app.drag?.moved) return;
  const {name,event}=app.drag;
  app.setLoad(name,dragLoad(app.fig,name,pointerInFigure(app.svg,event),app.frac,app.state.lastAngle[name]));
}

function wireDrag(app) {
  const svg=app.svg;
  svg.addEventListener('pointerdown',event=>{
    const handle=event.target?.closest?.('[data-load]');
    if (app.drag || event.button!==0 || !handle || !svg.contains(handle) ||
        handle.getAttribute('aria-disabled')==='true') return;
    event.preventDefault();
    handle.focus({preventScroll:true});
    app.drag={name:handle.getAttribute('data-load'),pointerId:event.pointerId,
      origin:{x:event.clientX,y:event.clientY},event:{clientX:event.clientX,clientY:event.clientY},moved:false};
    // Capture on the persistent figure, never on a handle render() replaces.
    svg.setPointerCapture(event.pointerId);
    svg.classList.toggle('is-dragging',true);
    app.redraw();
  });
  function move(event) {
    if (!app.drag || event.pointerId!==app.drag.pointerId) return false;
    const drag=app.drag;
    drag.moved ||= event.clientX!==drag.origin.x || event.clientY!==drag.origin.y;
    drag.event={clientX:event.clientX,clientY:event.clientY};
    updateDrag(app);
    return true;
  }
  svg.addEventListener('pointermove',event=>{
    if (move(event)) { event.preventDefault(); app.redraw(); }
  });
  function finish(event, released) {
    if (!app.drag || event.pointerId!==app.drag.pointerId) return;
    if (released) move(event);
    app.drag=null;
    svg.classList.toggle('is-dragging',false);
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    app.redraw();
  }
  svg.addEventListener('pointerup',event=>finish(event,true));
  svg.addEventListener('pointercancel',event=>finish(event,false));
  svg.addEventListener('lostpointercapture',event=>finish(event,false));
}

// ===== kbd.js =====


function stepLoad(vec, nominal, key, lastAngle) {
  let magnitude=Math.hypot(vec.x,vec.y);
  let angle=magnitude ? Math.atan2(vec.y,vec.x) : lastAngle;
  if (key==='ArrowLeft') angle+=Math.PI/36;
  else if (key==='ArrowRight') angle-=Math.PI/36;
  else if (key==='ArrowUp') magnitude+=0.05*nominal;
  else if (key==='ArrowDown') magnitude-=0.05*nominal;
  else return {vec:{...vec},lastAngle};
  magnitude=Math.max(0,Math.min(LOAD_CAP*nominal,magnitude));
  if (magnitude<1e-12*nominal) magnitude=0;
  // Keyboard increments intentionally bypass the pointer's 8% zero snap:
  // otherwise Up from zero could never reach its first 5% step.
  return {vec:magnitude ? loadVector(magnitude,angle) : {x:0,y:0},lastAngle:angle};
}

function wireKeys(app) {
  app.svg.addEventListener('keydown',event=>{
    if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
    const handle=event.target?.closest?.('[data-load]');
    if (!handle || !app.svg.contains(handle) || app.svg.ownerDocument.activeElement!==handle) return;
    event.preventDefault();
    if (app.drag || handle.getAttribute('aria-disabled')==='true') return;
    const name=handle.getAttribute('data-load'), load=app.fig.loads.find(l=>l.name===name);
    app.setLoad(name,stepLoad(app.state.loads[name],Math.hypot(load.nominal.x,load.nominal.y),
      event.key,app.state.lastAngle[name]));
    app.redraw();
  });
}

// ===== figures/fig1.js =====
const FIG1 = {
  id: 1, title: 'Frame 1',
  points: { A: {x:0,y:0}, B: {x:12.4,y:0}, C: {x:9.65,y:7.8} },
  members: [
    { id:'AC', path:[{seg:'line',from:'A',to:'C'}], width:0.8 },
    { id:'CB', path:[{seg:'line',from:'C',to:'B'}], width:0.8 }
  ],
  supports: [
    { name:'A', at:'A', member:'AC', kind:'pin', surface:'floor' },
    { name:'B', at:'B', member:'CB', kind:'pin', surface:'floor' }
  ],
  joints: [{ name:'C', at:'C', members:['AC','CB'], kind:'pin' }],
  loads: [
    { name:'P', at:{x:0.466*9.65,y:0.466*7.8}, member:'AC', nominal:{x:0,y:-1} },
    { name:'Q', at:{x:9.65+0.62*(12.4-9.65),y:7.8*(1-0.62)}, member:'CB', nominal:{x:0,y:-1} }
  ],
  balls: [],
  // arrowPerForce: force-to-length scale (units per unit force), set so the worst case (each load up to 1.5x nominal in any
  // direction, alone or together) fits and typical arrows are clearly visible. Exploded: the members slide apart.
  // The viewBox and the px-per-unit scale are not stored: computeLayout() (layout.js) derives them from the figure's
  // bounds plus the worst-case arrow envelope and the window's size.
  // arrowMargin 0.33: the shared 0.2 leaves labels crowded at the pins (label~owner) at 1280x720; set by the harness sweep.
  view: { arrowMargin:0.33, arrowPerForce:1.52,
    explode:{ AC:{dx:-3,dy:0}, CB:{dx:3,dy:0} } }
};

// ===== pages/page-1.js =====

const FIGURE = FIG1;

// ===== app.js =====






// The optional platform hooks keep timing deterministic in the Node tests.
function createApp(root, fig, options = {}) {
  const svg=root.querySelector('#scene'), button=root.querySelector('#explode'), status=root.querySelector('#status');
  let spoken=null;
  const requestFrame=options.requestAnimationFrame || (callback=>globalThis.requestAnimationFrame(callback));
  const cancelFrame=options.cancelAnimationFrame || (id=>globalThis.cancelAnimationFrame(id));
  const now=options.now || (()=>globalThis.performance.now());
  const reducedMotion=options.reducedMotion || (()=>globalThis.matchMedia?.('(prefers-reduced-motion: reduce)').matches===true);
  const solveLoads=options.solve || solve;
  const app={fig,svg,button,state:initialState(fig),frac:0,drag:null,solution:null};
  let frame=null;

  app.setLoad=(name,result)=>{
    const before=app.state.loads[name];
    app.state.lastAngle[name]=result.lastAngle;
    if (before.x===result.vec.x && before.y===result.vec.y) return;
    app.state.loads[name]=result.vec;
    app.solution=solveLoads(fig,app.state.loads);
  };
  app.redraw=()=>{
    const focused=svg.ownerDocument.activeElement;
    const keep=svg.contains(focused) ? focused?.getAttribute('data-load') : null;
    render(svg,fig,{loads:app.state.loads,held:app.drag?.name || null},app.solution,app.frac);
    if (keep) svg.querySelector(`[data-load="${keep}"]`)?.focus({preventScroll:true});
    // The live region lives outside the SVG (which every redraw recreates) and is written only when its text changes.
    const lift=liftOffText(fig,app.solution);
    if (status && lift!==spoken) { spoken=lift; status.textContent=lift; }
    button.textContent=app.state.explodeTarget ? 'Combine' : 'Explode';
    button.setAttribute('aria-pressed',String(app.state.explodeTarget===1));
  };
  app.toggleExplode=()=>{
    if (frame!==null) { cancelFrame(frame); frame=null; }
    const start=app.frac, target=1-app.state.explodeTarget;
    app.state.explodeTarget=target;
    const began=now(), duration=500*Math.abs(target-start);
    if (reducedMotion() || duration===0) {
      app.frac=target; updateDrag(app); app.redraw(); return;
    }
    const animate=timestamp=>{
      frame=null;
      const elapsed=timestamp-began;
      app.frac=reducedMotion() ? target : start+(target-start)*ease(elapsed/duration);
      // A moved pointer holds its tail in screen space while the member moves.
      // setLoad solves only if this actually changes the snapped vector.
      updateDrag(app);
      app.redraw();
      if (app.frac!==target) frame=requestFrame(animate);
    };
    app.redraw();
    frame=requestFrame(animate);
  };
  // The layout depends on the window: redraw (at the same state) when it is resized or rotated.
  if (typeof window!=='undefined' && window.addEventListener) window.addEventListener('resize',()=>app.redraw());
  button.disabled=false;
  button.addEventListener('click',()=>{ if (!button.disabled) app.toggleExplode(); });
  wireDrag(app);
  wireKeys(app);
  app.solution=solveLoads(fig,app.state.loads);
  app.redraw();
  return app;
}

// The inliner supplies FIGURE before this module; importing it in Node is inert.
// globalThis.__frameApp is the test hook the browser harness drives (setLoad, frac, redraw).
if (typeof document!=='undefined' && typeof FIGURE!=='undefined') globalThis.__frameApp=createApp(document,FIGURE);

})();
</script>
